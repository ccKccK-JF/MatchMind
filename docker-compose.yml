name: matchmind

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - matchmind

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchmind
      POSTGRES_USER: matchmind
      POSTGRES_PASSWORD: matchmind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - matchmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmind -d matchmind"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    networks:
      - matchmind
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    restart: "no"
    environment:
      POSTGRES_DSN: "postgres://matchmind:matchmind@postgres:5432/matchmind?sslmode=disable"
    networks:
      - matchmind
    depends_on:
      postgres:
        condition: service_healthy

  player:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: player-service
    environment:
      PLAYER_GRPC_ADDRESS: ":50051"
      PLAYER_HTTP_ADDRESS: ":8081"
      PLAYER_RATING_SYSTEM: "elo"
      PLAYER_ELO_K_FACTOR: "32"
      PLAYER_GLICKO2_TAU: "0.5"
      PLAYER_STORAGE_BACKEND: "postgres"
      POSTGRES_DSN: "postgres://matchmind:matchmind@postgres:5432/matchmind?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  matchmaking:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: matchmaking-service
    environment:
      MATCHMAKING_GRPC_ADDRESS: ":50052"
      MATCHMAKING_HTTP_ADDRESS: ":8082"
      MATCHMAKING_WORKER_COUNT: "10"
      MATCHMAKING_POLICY_MODE: "ab"
      MATCHMAKING_BEAM_WIDTH: "64"
      MATCHMAKING_AB_TREATMENT_BPS: "5000"
      MATCHMAKING_ALLOCATOR_BACKEND: "local"
      MATCHMAKING_LOCAL_REGION_CAPACITIES: "hongkong=100,singapore=100,tokyo=100"
      AGENT_CONTROL_TOKEN: "matchmind-compose-agent-control"
      MATCHMAKING_TICKET_STORAGE_BACKEND: "redis"
      MATCHMAKING_MATCH_STORAGE_BACKEND: "postgres"
      POSTGRES_DSN: "postgres://matchmind:matchmind@postgres:5432/matchmind?sslmode=disable"
      REDIS_ADDRESS: "redis:6379"
      REDIS_KEY_PREFIX: "matchmind"
      PLAYER_GRPC_TARGET: "player:50051"
    depends_on:
      player:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  simulation:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: simulation-service
    environment:
      SIMULATION_GRPC_ADDRESS: ":50053"
      SIMULATION_HTTP_ADDRESS: ":8083"
      MATCHMAKING_GRPC_TARGET: "matchmaking:50052"
      PLAYER_GRPC_TARGET: "player:50051"
    depends_on:
      player:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  agent:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: agent-service
    environment:
      AGENT_GRPC_ADDRESS: ":50054"
      AGENT_HTTP_ADDRESS: ":8084"
      AGENT_STORAGE_BACKEND: "postgres"
      AGENT_NAME: "matchmind-policy-advisor"
      AGENT_MODEL: "deterministic-policy-advisor-v1"
      AGENT_PROMPT_VERSION: "matchmind-agent-v1"
      AGENT_DEFAULT_BASE_POLICY: "v1-greedy"
      AGENT_CONTROL_TOKEN: "matchmind-compose-agent-control"
      POSTGRES_DSN: "postgres://matchmind:matchmind@postgres:5432/matchmind?sslmode=disable"
      MATCHMAKING_GRPC_TARGET: "matchmaking:50052"
    depends_on:
      matchmaking:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8084/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  api:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: api-service
    environment:
      API_HTTP_ADDRESS: ":8080"
      PLAYER_GRPC_TARGET: "player:50051"
      MATCHMAKING_GRPC_TARGET: "matchmaking:50052"
      SIMULATION_GRPC_TARGET: "simulation:50053"
      AGENT_GRPC_TARGET: "agent:50054"
    depends_on:
      player:
        condition: service_healthy
      matchmaking:
        condition: service_healthy
      simulation:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - matchmind
    depends_on:
      api:
        condition: service_healthy

networks:
  matchmind:
    driver: bridge

volumes:
  postgres-data:
