syntax = "proto3";

package matchmind.matchmaking.v1;

import "google/protobuf/timestamp.proto";
import "matchmind/player/v1/player.proto";

option go_package = "github.com/ccKccK-JF/MatchMind/gen/go/matchmind/matchmaking/v1;matchmakingv1";

service MatchmakingService {
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc GetActiveTicketForPlayer(GetActiveTicketForPlayerRequest) returns (GetActiveTicketForPlayerResponse);
  rpc CancelTicket(CancelTicketRequest) returns (CancelTicketResponse);
  rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
  rpc StartMatch(StartMatchRequest) returns (StartMatchResponse);
  rpc CompleteMatch(CompleteMatchRequest) returns (CompleteMatchResponse);
  rpc AnalyzeMatchQuality(AnalyzeMatchQualityRequest) returns (AnalyzeMatchQualityResponse);
  rpc ReplayHistoricalMatch(ReplayHistoricalMatchRequest) returns (ReplayHistoricalMatchResponse);
  rpc GetOperationalSnapshot(GetOperationalSnapshotRequest) returns (GetOperationalSnapshotResponse);
  rpc ActivateApprovedPolicy(ActivateApprovedPolicyRequest) returns (ActivateApprovedPolicyResponse);
  rpc RollbackPolicyExperiment(RollbackPolicyExperimentRequest) returns (RollbackPolicyExperimentResponse);
}

enum TicketState {
  TICKET_STATE_UNSPECIFIED = 0;
  TICKET_STATE_CREATED = 1;
  TICKET_STATE_QUEUED = 2;
  TICKET_STATE_RESERVED = 3;
  TICKET_STATE_ASSIGNED = 4;
  TICKET_STATE_CANCELLED = 5;
  TICKET_STATE_EXPIRED = 6;
  TICKET_STATE_FAILED = 7;
}

enum MatchState {
  MATCH_STATE_UNSPECIFIED = 0;
  MATCH_STATE_CREATED = 1;
  MATCH_STATE_ALLOCATING = 2;
  MATCH_STATE_READY = 3;
  MATCH_STATE_RUNNING = 4;
  MATCH_STATE_FINISHED = 5;
  MATCH_STATE_FAILED = 6;
}

enum WinningTeam {
  WINNING_TEAM_UNSPECIFIED = 0;
  WINNING_TEAM_A = 1;
  WINNING_TEAM_B = 2;
}

message MatchTicket {
  string id = 1;
  string player_id = 2;
  string party_id = 3;
  string mode = 4;
  string client_version = 5;
  string region = 6;
  double rating = 7;
  TicketState state = 8;
  repeated matchmind.player.v1.Role preferred_roles = 9;
  map<string, int32> region_latency_ms = 10;
  google.protobuf.Timestamp created_at = 11;
  string reservation_id = 12;
  google.protobuf.Timestamp reservation_expires_at = 13;
  string match_id = 14;
}

message Team {
  string id = 1;
  repeated string player_ids = 2;
  double average_rating = 3;
  repeated TeamPlayer player_details = 4;
}

message TeamPlayer {
  string player_id = 1;
  string ticket_id = 2;
  string party_id = 3;
  matchmind.player.v1.Role role = 4;
  double rating = 5;
}

message Match {
  string id = 1;
  Team team_a = 2;
  Team team_b = 3;
  MatchState state = 4;
  string server_region = 5;
  string policy_version = 6;
  double predicted_win_rate_a = 7;
  double quality_score = 8;
  google.protobuf.Timestamp created_at = 9;
  string server_address = 10;
  string connection_token = 11;
  double skill_score = 12;
  double role_score = 13;
  double latency_score = 14;
  double party_score = 15;
  double wait_score = 16;
  repeated string quality_reasons = 17;
  string mode = 18;
  MatchResult result = 19;
}

message MatchResult {
  WinningTeam winning_team = 1;
  int64 random_seed = 2;
  int32 duration_seconds = 3;
  int32 score_a = 4;
  int32 score_b = 5;
  double max_advantage = 6;
  bool has_afk = 7;
  bool surrendered = 8;
  bool one_sided = 9;
  double actual_quality_score = 10;
}

message CreateTicketRequest {
  string player_id = 1;
  string party_id = 2;
  string mode = 3;
  string client_version = 4;
  repeated matchmind.player.v1.Role preferred_roles = 5;
  map<string, int32> region_latency_ms = 6;
  string idempotency_key = 7;
}

message CreateTicketResponse {
  MatchTicket ticket = 1;
}

message GetTicketRequest {
  string ticket_id = 1;
}

message GetTicketResponse {
  MatchTicket ticket = 1;
}

message GetActiveTicketForPlayerRequest {
  string player_id = 1;
}

message GetActiveTicketForPlayerResponse {
  bool found = 1;
  MatchTicket ticket = 2;
}

message CancelTicketRequest {
  string ticket_id = 1;
  string player_id = 2;
  string idempotency_key = 3;
}

message CancelTicketResponse {
  MatchTicket ticket = 1;
}

message GetMatchRequest {
  string match_id = 1;
}

message GetMatchResponse {
  Match match = 1;
}

message StartMatchRequest {
  string match_id = 1;
}

message StartMatchResponse {
  Match match = 1;
}

message CompleteMatchRequest {
  string match_id = 1;
  MatchResult result = 2;
}

message CompleteMatchResponse {
  Match match = 1;
}

message AnalyzeMatchQualityRequest {
  string policy_version = 1;
  string mode = 2;
  string server_region = 3;
  google.protobuf.Timestamp from = 4;
  google.protobuf.Timestamp to = 5;
  int32 limit = 6;
}

message MatchQualityObservation {
  string match_id = 1;
  string policy_version = 2;
  string mode = 3;
  string server_region = 4;
  double predicted_quality = 5;
  double actual_quality = 6;
  double signed_quality_error = 7;
  double absolute_quality_error = 8;
  double predicted_win_rate_a = 9;
  double team_a_outcome = 10;
  double win_probability_brier = 11;
  int32 duration_seconds = 12;
  bool one_sided = 13;
  bool has_afk = 14;
  bool surrendered = 15;
  google.protobuf.Timestamp created_at = 16;
  double skill_score = 17;
  double role_score = 18;
  double latency_score = 19;
  double party_score = 20;
  double wait_score = 21;
  double average_rating = 22;
}

message PolicyQualitySummary {
  string policy_version = 1;
  int32 match_count = 2;
  double average_predicted_quality = 3;
  double average_actual_quality = 4;
  double mean_signed_quality_error = 5;
  double mean_absolute_quality_error = 6;
  double win_probability_brier_score = 7;
  double team_a_win_rate = 8;
  double average_duration_seconds = 9;
  double one_sided_rate = 10;
  double afk_rate = 11;
  double surrender_rate = 12;
}

message AnalyzeMatchQualityResponse {
  repeated MatchQualityObservation observations = 1;
  repeated PolicyQualitySummary summaries = 2;
}

message ReplayHistoricalMatchRequest {
  string match_id = 1;
  repeated string policy_versions = 2;
  repeated string ticket_ids = 3;
  repeated MatchPolicyDefinition candidate_policies = 4;
}

message MatchPolicyDefinition {
  string version = 1;
  int32 team_size = 2;
  int32 candidate_limit = 3;
  string team_algorithm = 4;
  int32 beam_width = 5;
  double skill_weight = 6;
  double role_weight = 7;
  double latency_weight = 8;
  double party_weight = 9;
  double wait_weight = 10;
  double initial_rating_range = 11;
  double max_rating_range = 12;
  double rating_expansion_per_second = 13;
  int32 max_latency_ms = 14;
  double min_quality_score = 15;
  int64 reservation_ttl_ms = 16;
  int64 ticket_ttl_ms = 17;
}

message ReplayTeam {
  repeated TeamPlayer players = 1;
  double average_rating = 2;
  double role_score = 3;
}

message ReplayQuality {
  double total_score = 1;
  double skill_score = 2;
  double role_score = 3;
  double latency_score = 4;
  double party_score = 5;
  double wait_score = 6;
  double predicted_win_rate_a = 7;
  double predicted_win_rate_b = 8;
  repeated string reasons = 9;
}

message ReplayOutcome {
  string policy_version = 1;
  string algorithm = 2;
  bool matched = 3;
  string failure_reason = 4;
  int32 accepted_tickets = 5;
  int32 rejected_tickets = 6;
  int32 candidate_sets = 7;
  int32 formations_evaluated = 8;
  ReplayTeam team_a = 9;
  ReplayTeam team_b = 10;
  ReplayQuality quality = 11;
  double quality_delta = 12;
  bool same_team_split = 13;
  bool same_role_assignments = 14;
}

message ReplayHistoricalMatchResponse {
  string source_match_id = 1;
  string source_policy_version = 2;
  double source_predicted_quality = 3;
  double source_actual_quality = 4;
  double source_absolute_error = 5;
  int32 ticket_count = 6;
  repeated ReplayOutcome outcomes = 7;
}

message GetOperationalSnapshotRequest {}

message PolicyExperiment {
  string id = 1;
  string control_version = 2;
  string treatment_version = 3;
  int32 treatment_basis_points = 4;
  string assignment_salt = 5;
  google.protobuf.Timestamp started_at = 6;
}

message GetOperationalSnapshotResponse {
  int32 queue_size = 1;
  repeated MatchPolicyDefinition policies = 2;
  PolicyExperiment active_experiment = 3;
}

message ActivateApprovedPolicyRequest {
  string approval_id = 1;
  MatchPolicyDefinition policy = 2;
  int32 treatment_basis_points = 3;
  string assignment_salt = 4;
}

message ActivateApprovedPolicyResponse {
  PolicyExperiment experiment = 1;
}

message RollbackPolicyExperimentRequest {
  string experiment_id = 1;
}

message RollbackPolicyExperimentResponse {
  bool rolled_back = 1;
}
