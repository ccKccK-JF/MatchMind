syntax = "proto3";

package matchmind.player.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ccKccK-JF/MatchMind/gen/go/matchmind/player/v1;playerv1";

service PlayerService {
  rpc CreatePlayer(CreatePlayerRequest) returns (CreatePlayerResponse);
  rpc GetPlayer(GetPlayerRequest) returns (GetPlayerResponse);
  rpc ApplyMatchResult(ApplyMatchResultRequest) returns (ApplyMatchResultResponse);
  rpc GetRatingHistory(GetRatingHistoryRequest) returns (GetRatingHistoryResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VANGUARD = 1;
  ROLE_ROAMER = 2;
  ROLE_CORE = 3;
  ROLE_RANGED = 4;
  ROLE_SUPPORT = 5;
}

enum MatchOutcome {
  MATCH_OUTCOME_UNSPECIFIED = 0;
  MATCH_OUTCOME_TEAM_A_WIN = 1;
  MATCH_OUTCOME_TEAM_B_WIN = 2;
  MATCH_OUTCOME_DRAW = 3;
}

message Player {
  string id = 1;
  string name = 2;
  double rating = 3;
  double rating_deviation = 4;
  repeated Role preferred_roles = 5;
  string home_region = 6;
  map<string, int32> region_latency_ms = 7;
  double behavior_score = 8;
  google.protobuf.Timestamp created_at = 9;
}

message CreatePlayerRequest {
  string id = 1;
  string name = 2;
  double initial_rating = 3;
  repeated Role preferred_roles = 4;
  string home_region = 5;
  map<string, int32> region_latency_ms = 6;
  double behavior_score = 7;
}

message CreatePlayerResponse {
  Player player = 1;
}

message GetPlayerRequest {
  string player_id = 1;
}

message GetPlayerResponse {
  Player player = 1;
}

message RatingChange {
  string player_id = 1;
  string match_id = 2;
  double before = 3;
  double after = 4;
  double delta = 5;
  string reason = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ApplyMatchResultRequest {
  string match_id = 1;
  repeated string team_a_player_ids = 2;
  repeated string team_b_player_ids = 3;
  MatchOutcome outcome = 4;
  string reason = 5;
}

message ApplyMatchResultResponse {
  repeated RatingChange changes = 1;
}

message GetRatingHistoryRequest {
  string player_id = 1;
}

message GetRatingHistoryResponse {
  repeated RatingChange changes = 1;
}
