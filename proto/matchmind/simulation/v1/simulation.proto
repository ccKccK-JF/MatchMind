syntax = "proto3";

package matchmind.simulation.v1;

option go_package = "github.com/ccKccK-JF/MatchMind/gen/go/matchmind/simulation/v1;simulationv1";

service SimulationService {
  rpc SimulateMatch(SimulateMatchRequest) returns (SimulateMatchResponse);
  rpc SimulateBatch(SimulateBatchRequest) returns (SimulateBatchResponse);
}

message BatchSimulationInput {
  string case_id = 1;
  int64 random_seed = 2;
  double rating_a = 3;
  double rating_b = 4;
  double predicted_win_rate_a = 5;
  double role_score = 6;
  double latency_score = 7;
  double party_score = 8;
}

message SimulateBatchRequest {
  repeated BatchSimulationInput inputs = 1;
  int32 concurrency = 2;
}

message SimulateBatchResponse {
  repeated SimulateMatchResponse results = 1;
  int32 simulation_count = 2;
  double team_a_win_rate = 3;
  double average_duration_seconds = 4;
  double average_actual_quality_score = 5;
  double one_sided_rate = 6;
  double afk_rate = 7;
  double surrender_rate = 8;
}

enum WinningTeam {
  WINNING_TEAM_UNSPECIFIED = 0;
  WINNING_TEAM_A = 1;
  WINNING_TEAM_B = 2;
}

message SimulateMatchRequest {
  string match_id = 1;
  int64 random_seed = 2;
}

message SimulateMatchResponse {
  string match_id = 1;
  WinningTeam winning_team = 2;
  int32 duration_seconds = 3;
  int32 score_a = 4;
  int32 score_b = 5;
  double max_advantage = 6;
  bool has_afk = 7;
  bool surrendered = 8;
  bool one_sided = 9;
  double actual_quality_score = 10;
  int64 random_seed = 11;
}
